apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "keycloak-client-provisioner.fullname" . }}
  labels:
    {{- include "keycloak-client-provisioner.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ .Values.keycloak.adminSecret.name | quote }}
    verbs:
      - get

  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ .Values.outputSecret.name | quote }}
    verbs:
      - get
      - patch

  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "keycloak-client-provisioner.fullname" . }}
  labels:
    {{- include "keycloak-client-provisioner.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "keycloak-client-provisioner.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "keycloak-client-provisioner.fullname" . }}
