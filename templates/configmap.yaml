apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "keycloak-client-provisioner.fullname" . }}
  labels:
    {{- include "keycloak-client-provisioner.labels" . | nindent 4 }}
data:
  provision.sh: |
    {{- .Files.Get "scripts/provision.sh" | nindent 4 }}
  common.sh: |
    {{- .Files.Get "scripts/common.sh" | nindent 4 }}
  keycloak.sh: |
    {{- .Files.Get "scripts/keycloak.sh" | nindent 4 }}
  client.sh: |
    {{- .Files.Get "scripts/client.sh" | nindent 4 }}
  kubernetes.sh: |
    {{- .Files.Get "scripts/kubernetes.sh" | nindent 4 }}
